# Paramètres des bots — modifiables (à terme depuis le QG Jarvis).
# Règle du cycle : un seul paramètre modifié par cycle.

direct:
  actif: false                     # false = bot en pause (aucun ordre passé)

cycle:
  trades_par_cycle: 100
  duree_max_semaines: 6

risque:
  risque_par_trade_pct: 0.5        # % du capital risqué par trade
  frais_max_part_risque: 0.25      # on saute le trade si frais + glissement > 25 % du risque
  pertes_consecutives_max: 3       # coupe-circuit : arrêt de la stratégie pour la journée
  cloture_actions: "21:55"         # heure de Paris, toute position actions est clôturée
  une_position_par_actif: true

swing_k: 3                         # un swing = 3 bougies plus basses/hautes de chaque côté

actifs:
  QQQ:
    type: action
    frais_pct: 0.0                 # Alpaca : pas de commission sur les actions
    glissement: 0.02               # $ par action et par côté
    notionnel_max_pct: 200         # taille max de position en % du capital
  BTC/USD:
    type: crypto
    frais_pct: 0.25                # Alpaca crypto : frais par côté (palier de départ)
    glissement_pct: 0.01
    notionnel_max_pct: 90
    vente_a_decouvert: false       # Alpaca n'autorise pas la vente à découvert de crypto
    frais_max_part_risque: 10      # filtre de frais désactivé sur BTC (argent fictif, choix de Rayan) ; frais toujours déduits des résultats

strategies:
  ict:                             # ICT strict (règles canoniques)
    actif: true
    max_trades_jour: 2
    k_htf: 2                       # biais : structure 4 h
    deplacement_atr: 1.5           # bougie de déplacement ≥ 1,5 ATR (1 min)
    fenetre_sweep: 60              # le sweep doit dater de moins de 60 min
    marge_stop_atr: 0.1
    expiration_bougies: 15         # ordre limite au milieu du FVG, annulé après 15 min
    r_min: 2.0
  perso_1h:                        # modèle de Rayan, structure 1 h
    fonction: perso
    actif: true
    ut: 1h
    max_trades_jour: 2
    k_structure: 2                 # swings fractals (2 bougies de chaque côté)
    k_4h: 2
    k_3m: 2
    ote_min: 0.62
    ote_max: 0.79
    entree_ote: 0.62               # ordre limite au 61,8 % de la jambe 3 min
    expiration_minutes: 60
    r_min: 1.0                     # objectif : liquidité la plus proche à ≥ 1R
    break_even_r: 1.0
    marge_stop_atr: 0.1            # marge au-delà de la mèche (ATR 3 min)
    attente_mss_bougies3: 80       # le MSS 3 min doit venir dans les 4 h après le contact
    age_max_bos: 72                # en bougies de structure
    tolerance_5e_atr: 0.25         # swing 4 h = ★★★★★ s'il est à moins de 0,25 ATR daily d'un swing daily
  perso_2h:                        # même modèle, structure 2 h
    fonction: perso
    actif: true
    ut: 2h
    max_trades_jour: 2
    k_structure: 2
    k_4h: 2
    k_3m: 2
    ote_min: 0.62
    ote_max: 0.79
    entree_ote: 0.62
    expiration_minutes: 60
    r_min: 1.0
    break_even_r: 1.0
    marge_stop_atr: 0.1
    attente_mss_bougies3: 80
    age_max_bos: 36
    tolerance_5e_atr: 0.25
  sr:
    actif: true
    max_trades_jour: 3
    r_min: 1.5
    jours_zones: 3
    regroupement_atr: 0.25
    touches_min: 2
    meche_min: 0.5
    marge_stop_atr: 0.2
    fenetre_retest: 12
  vp:
    actif: false                   # laissé de côté pour l'instant (choix de Rayan, 8 oct.)
    max_trades_jour: 2
    r_min: 1.5
    zone_valeur: 0.70
    marge_stop_atr: 0.2
    meche_min: 0.5

backtest:
  jours: 182                      # 6 mois
  trades_min: 30
