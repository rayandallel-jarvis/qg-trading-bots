# Paramètres des bots — modifiables (à terme depuis le QG Jarvis).
# Règle du cycle : un seul paramètre modifié par cycle.

direct:
  actif: false                     # false = bot en pause (aucun ordre passé)

cycle:
  trades_par_cycle: 100
  duree_max_semaines: 6

risque:
  risque_par_trade_pct: 0.5        # % du capital risqué par trade
  frais_max_part_risque: 0.25      # on saute le trade si frais + glissement > 25 % du risque
  pertes_consecutives_max: 3       # coupe-circuit : arrêt de la stratégie pour la journée
  cloture_actions: "21:55"         # heure de Paris, toute position actions est clôturée
  une_position_par_actif: true

swing_k: 3                         # un swing = 3 bougies plus basses/hautes de chaque côté

actifs:
  # --- IG démo (CFD) : marchés actifs depuis le 9 oct. ---------------------------------------------
  # Coûts IG = écart achat/vente (pas de commission) ; écart serré pendant les heures principales
  # (heure de Paris), plus large en dehors (relevé le 9 oct. à 1 h : Nasdaq 2,0 · or 1,0 · BTC 150).
  NAS100:
    actif: true
    broker: ig
    epic: IX.D.NASDAQ.IEN.IP       # US Tech 100 au comptant, contrat 1 $ par point
    type: cfd
    source: duka
    instrument: USATECH.IDX-USD
    ecart_coeur: 1.0
    ecart_hors: 2.5
    heures_coeur: "15:30-22:00"
    glissement: 0.2
    stop_min: 4.0                  # distance minimale du stop chez IG (points)
    notionnel_max_pct: 500
  OR:
    actif: true
    broker: ig
    epic: CS.D.CFEGOLD.CEF.IP      # or au comptant, contrat 1 $
    type: cfd
    source: duka
    instrument: XAU-USD
    ecart_coeur: 0.4
    ecart_hors: 1.0
    heures_coeur: "09:00-22:00"
    glissement: 0.05
    stop_min: 1.0
    notionnel_max_pct: 500
  EURUSD:
    actif: true
    broker: ig
    epic: CS.D.EURUSD.CEF.IP       # code trouvé le 9 oct. (recherche « EURUSD »)
    type: cfd
    source: duka
    instrument: EUR-USD
    ecart_coeur: 0.00007
    ecart_hors: 0.00015
    heures_coeur: "09:00-22:00"
    glissement: 0.00001
    stop_min: 0.0002
    notionnel_max_pct: 1000
  BTC:
    actif: true
    broker: ig
    epic: CS.D.BITCOIN.CEF.IP      # Bitcoin, contrat 1 $
    type: cfd
    source: duka
    instrument: BTC-USD
    ferme_week_end: false          # le Bitcoin cote aussi le week-end chez IG
    ecart_coeur: 100
    ecart_hors: 150
    heures_coeur: "15:30-22:00"
    glissement: 10
    stop_min_pct: 1.0              # IG impose un stop à au moins 1 % du prix
    notionnel_max_pct: 180         # marge IG de 50 % sur le Bitcoin

  # --- Nouveaux actifs testés le 9 oct. (backtest seulement, pas encore branchés sur IG) -----------
  # Écarts et stops minimum = estimations des conditions standard IG, à vérifier avec infos_ig.py
  # avant toute mise en direct ; epic à confirmer.
  US30:
    actif: false
    broker: ig
    type: cfd
    source: duka
    instrument: USA30.IDX-USD
    ecart_coeur: 2.4
    ecart_hors: 5.0
    heures_coeur: "15:30-22:00"
    glissement: 0.5
    stop_min: 8.0
    notionnel_max_pct: 500
  US500:
    actif: false
    broker: ig
    type: cfd
    source: duka
    instrument: USA500.IDX-USD
    ecart_coeur: 0.4
    ecart_hors: 1.5
    heures_coeur: "15:30-22:00"
    glissement: 0.1
    stop_min: 1.0
    notionnel_max_pct: 500
  DAX:
    actif: false
    broker: ig
    type: cfd
    source: duka
    instrument: DEU.IDX-EUR
    ecart_coeur: 1.2
    ecart_hors: 4.0
    heures_coeur: "09:00-17:30"
    glissement: 0.3
    stop_min: 5.0
    notionnel_max_pct: 500
  GBPUSD:
    actif: false
    broker: ig
    type: cfd
    source: duka
    instrument: GBP-USD
    ecart_coeur: 0.00009
    ecart_hors: 0.0002
    heures_coeur: "09:00-22:00"
    glissement: 0.00001
    stop_min: 0.0002
    notionnel_max_pct: 1000
  USDJPY:
    actif: false
    broker: ig
    type: cfd
    source: duka
    instrument: USD-JPY
    ecart_coeur: 0.007
    ecart_hors: 0.015
    heures_coeur: "02:00-22:00"
    glissement: 0.001
    stop_min: 0.02
    notionnel_max_pct: 200000

  # --- Alpaca paper : mis de côté le 9 oct. (frais crypto, pas de vente à découvert) ---------------
  QQQ:
    actif: false
    broker: alpaca
    type: action
    frais_pct: 0.0
    glissement: 0.02
    notionnel_max_pct: 200
  BTC/USD:
    actif: false
    broker: alpaca
    type: crypto
    frais_pct: 0.25
    glissement_pct: 0.01
    notionnel_max_pct: 90
    vente_a_decouvert: false
    frais_max_part_risque: 10

strategies:
  ict:                             # ICT strict (règles canoniques)
    actif: true
    max_trades_jour: 2
    k_htf: 2                       # biais : structure 4 h
    deplacement_atr: 1.5           # bougie de déplacement ≥ 1,5 ATR (1 min)
    fenetre_sweep: 60              # le sweep doit dater de moins de 60 min
    marge_stop_atr: 0.1
    expiration_bougies: 15         # ordre limite au milieu du FVG, annulé après 15 min
    r_min: 2.0
  perso_1h:                        # modèle de Rayan, structure 1 h
    fonction: perso
    actif: true
    ut: 1h
    max_trades_jour: 2
    k_structure: 2                 # swings fractals (2 bougies de chaque côté)
    k_4h: 2
    k_3m: 2
    ote_min: 0.62
    ote_max: 0.79
    entree_ote: 0.62               # ordre limite au 61,8 % de la jambe 3 min
    expiration_minutes: 60
    r_cible: 2.0                   # objectif fixe : 2R (règle de Rayan, 9 oct.)
    break_even_r: null             # retiré le 9 oct. : coûte cher avec un objectif à 2R
    marge_stop_atr: 0.1            # marge au-delà de l'OB (ATR de l'unité de structure)
    attente_mss_bougies3: 80       # le MSS 3 min doit venir dans les 4 h après le contact
    age_max_bos: 72                # en bougies de structure
  perso_2h:                        # même modèle, structure 2 h
    fonction: perso
    actif: true
    ut: 2h
    max_trades_jour: 2
    k_structure: 2
    k_4h: 2
    k_3m: 2
    ote_min: 0.62
    ote_max: 0.79
    entree_ote: 0.62
    expiration_minutes: 60
    r_cible: 2.0
    break_even_r: null             # retiré le 9 oct. : coûte cher avec un objectif à 2R
    marge_stop_atr: 0.1
    attente_mss_bougies3: 80
    age_max_bos: 36
  sr:
    actif: true
    max_trades_jour: 3
    r_min: 1.5
    jours_zones: 3
    regroupement_atr: 0.25
    touches_min: 2
    meche_min: 0.5
    marge_stop_atr: 0.2
    fenetre_retest: 12
  vp:
    actif: false                   # laissé de côté pour l'instant (choix de Rayan, 8 oct.)
    max_trades_jour: 2
    r_min: 1.5
    zone_valeur: 0.70
    marge_stop_atr: 0.2
    meche_min: 0.5

backtest:
  jours: 182                      # 6 mois
  trades_min: 30
