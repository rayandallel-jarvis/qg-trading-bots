name: Test de connexion IG
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/test_ig.py, .github/workflows/test-ig.yml]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/test_ig.py
        env:
          IG_API_KEY: ${{ secrets.IG_API_KEY }}
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          IG_ACC_TYPE: ${{ secrets.IG_ACC_TYPE }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - run: |
          git config user.name "qg-bots"; git config user.email "qg-bots@users.noreply.github.com"
          git add etat/test_ig.json && git commit -qm "Test IG" && git pull -q --rebase && git push -q
