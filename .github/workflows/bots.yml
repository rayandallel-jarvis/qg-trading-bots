name: Bots en direct
on:
  schedule:
    - cron: "10 1,7,13,19 * * *"   # 4 relances par jour (UTC), chaque passage dure 5 h 40
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["bots/**", "config.yaml", "requirements.txt", ".github/workflows/bots.yml"]
concurrency:
  group: bots-direct
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  bots:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          git config user.name "qg-bots"
          git config user.email "qg-bots@users.noreply.github.com"
      - run: python -m bots.direct --minutes 340
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
